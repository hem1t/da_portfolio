<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Particle Background</title>
    <style>
        :root {
            --accent-primary: #00d2ff;
            --accent-primary-light: #00a2ff;
            --accent-secondary: #9d50bb;
            --accent-secondary-light: #bf5af2;
            --bg-color: #0a0a0c;
        }

        body.light-theme {
            --bg-color: #f8f9fa;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            transition: background-color 0.5s ease;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            filter: blur(0.5px); /* Subtle softness */
        }

        /* Overlay to ensure readability if content is on top */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 10, 12, 0.4) 100%);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        body.light-theme .overlay {
            background: radial-gradient(circle at center, transparent 0%, rgba(248, 249, 250, 0.5) 100%);
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <div class="overlay"></div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 100;
        const connectionDistance = 140;
        const mouseRepelRadius = 160;
        
        let isDark = true;
        const rootStyle = getComputedStyle(document.documentElement);
        const colors = {
            dark: [
                rootStyle.getPropertyValue('--accent-primary').trim(),
                rootStyle.getPropertyValue('--accent-secondary').trim(),
                '#6a11cb', 
                '#2575fc'
            ],
            light: [
                rootStyle.getPropertyValue('--accent-primary-light').trim(),
                rootStyle.getPropertyValue('--accent-secondary-light').trim(),
                '#5ac8fa', 
                '#007aff'
            ]
        };

        const mouse = {
            x: null,
            y: null
        };

        // Listen for messages from parent
        window.addEventListener('message', (event) => {
            if (event.data.type === 'mouse-move') {
                mouse.x = event.data.x;
                mouse.y = event.data.y;
            } else if (event.data.type === 'theme-change') {
                isDark = event.data.isDark;
                document.body.classList.toggle('light-theme', !isDark);
                updateParticleColors();
            }
        });

        class Particle {
            constructor() {
                this.init();
            }

            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.density = (Math.random() * 20) + 1;
                this.assignColor();
            }

            assignColor() {
                const palette = isDark ? colors.dark : colors.light;
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                // Natural organic movement
                this.x += this.vx;
                this.y += this.vy;

                // Random jitter
                if (Math.random() > 0.98) {
                    this.vx += (Math.random() - 0.5) * 0.1;
                    this.vy += (Math.random() - 0.5) * 0.1;
                }

                // Bounce
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Mouse interaction (Repel)
                if (mouse.x !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouseRepelRadius) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseRepelRadius - distance) / mouseRepelRadius;
                        
                        this.x -= forceDirectionX * force * 5;
                        this.y -= forceDirectionY * force * 5;
                    }
                }
            }
        }

        function updateParticleColors() {
            particles.forEach(p => p.assignColor());
        }

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        let opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = isDark ? `rgba(157, 80, 187, ${opacity * 0.15})` : `rgba(191, 90, 242, ${opacity * 0.1})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connect();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
